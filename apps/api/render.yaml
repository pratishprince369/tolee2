services:
  - type: web
    name: tolee-signaling
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://tolee.in
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    autoDeploy: true
