<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Teal Gradient -->
    <linearGradient id="coverTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b64" />
      <stop offset="35%" stop-color="#008080" />
      <stop offset="70%" stop-color="#0A7C75" />
      <stop offset="100%" stop-color="#03534e" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E8B83" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Teal Background -->
  <rect width="1200" height="480" fill="url(#coverTealGrad)" />

  <!-- Bottom Left Organic Wave Layers -->
  <path d="M 0 250 C 140 280, 260 380, 190 480 L 0 480 Z" fill="#045d57" opacity="0.6" />
  <path d="M 0 330 C 200 340, 300 430, 240 480 L 0 480 Z" fill="#0E8B83" opacity="0.45" />

  <!-- Giant Translucent 't' Monogram on the Right -->
  <g fill="#ffffff" fill-opacity="0.12" transform="translate(680, -10)">
    <!-- Lowercase t shape -->
    <path d="M 125 30 L 125 105 L 185 105 L 185 165 L 125 165 L 125 330 C 125 380, 150 410, 205 410 C 225 410, 245 405, 260 395 L 260 465 C 235 475, 195 480, 160 480 C 80 480, 45 435, 45 340 L 45 165 L 10 165 L 10 105 L 45 105 L 45 30 Z" />
  </g>

  <!-- Left Side: Tolee Branding -->
  <g transform="translate(80, 130)">
    <!-- Tolee Headline -->
    <text x="0" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="70" font-weight="900" fill="#ffffff" letter-spacing="-1px">
      Tolee
    </text>
    <!-- Subtitle -->
    <text x="2" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.9" letter-spacing="0.2px">
      Your Community.
    </text>
    <text x="2" y="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.9" letter-spacing="0.2px">
      Your Voice. Your World.
    </text>
  </g>

  <!-- Right Side: Connect Create Belong in cursive script style -->
  <g transform="translate(930, 125)">
    <text x="0" y="30" font-family="'Brush Script MT', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="44" font-style="italic" fill="#5EEAD4" fill-opacity="0.92" letter-spacing="1px">
      Connect
    </text>
    <text x="5" y="80" font-family="'Brush Script MT', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="44" font-style="italic" fill="#5EEAD4" fill-opacity="0.92" letter-spacing="1px">
      Create
    </text>
    <text x="10" y="130" font-family="'Brush Script MT', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="46" font-style="italic" fill="#5EEAD4" fill-opacity="0.95" letter-spacing="1px">
      Belong
    </text>
    <!-- Underline flourish -->
    <path d="M 8 144 Q 65 156 140 140" fill="none" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
