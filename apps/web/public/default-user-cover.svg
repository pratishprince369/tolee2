<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>
    
    <!-- Accent Gradient Primary -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Accent Gradient Secondary -->
    <linearGradient id="accentGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1000" cy="100" r="280" fill="url(#accentGrad1)" filter="blur(80px)" opacity="0.35" />
  <circle cx="200" cy="300" r="300" fill="url(#accentGrad2)" filter="blur(90px)" opacity="0.3" />

  <!-- Abstract Wave Lines (Representing growth and career trajectory) -->
  <path d="M-100,280 Q250,120 600,240 T1300,180" fill="none" stroke="url(#accentGrad1)" stroke-width="3" stroke-opacity="0.3" />
  <path d="M-100,240 Q300,320 700,160 T1300,220" fill="none" stroke="url(#accentGrad2)" stroke-width="2" stroke-opacity="0.25" />
  <path d="M-100,200 Q200,180 500,300 T1300,140" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Abstract Network Nodes (Representing Professional Connections) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="850" y1="120" x2="950" y2="70" />
    <line x1="950" y1="70" x2="1050" y2="150" />
    <line x1="1050" y1="150" x2="920" y2="220" />
    <line x1="920" y1="220" x2="850" y2="120" />
    <line x1="950" y1="70" x2="920" y2="220" />
  </g>
  <g>
    <circle cx="850" cy="120" r="7" fill="#3b82f6" />
    <circle cx="950" cy="70" r="9" fill="#10b981" />
    <circle cx="1050" cy="150" r="6" fill="#6366f1" />
    <circle cx="920" cy="220" r="8" fill="#a855f7" />
  </g>

  <!-- Typography / Brand Silhouette -->
  <text x="600" y="360" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" fill-opacity="0.4" letter-spacing="6" text-anchor="middle">
    TOLEE PROFESSIONAL NETWORK
  </text>
</svg>
