<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hextris - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      width: 100%;
      max-width: 360px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 24px; font-weight: 900; color: #00D2C4; }
    .score { font-size: 16px; font-weight: 900; color: #00F0FF; }
    #canvas {
      background: #0E1624;
      border: 2px solid #1F2D40;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      flex: 1;
      max-width: 120px;
      background: #141F30;
      border: 1px solid #202E42;
      color: #00D2C4;
      padding: 12px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:active { background: #00D2C4; color: #000; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1>HEXTRIS</h1>
      <div class="score">Score: <span id="score">0</span></div>
    </div>

    <canvas id="canvas" width="320" height="380"></canvas>

    <div class="controls">
      <button class="btn" id="left">↺ ROTATE</button>
      <button class="btn" id="right">ROTATE ↻</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    const COLORS = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6'];
    let hexAngle = 0;
    let blocks = [];
    let score = 0;
    let active = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function spawnBlock() {
      const side = Math.floor(Math.random() * 6);
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      blocks.push({
        dist: 170,
        side: side,
        color: color,
        speed: 1.2
      });
    }

    function rotateHex(dir) {
      hexAngle += dir * (Math.PI / 3);
      beep(360, 0.03);
    }

    function update() {
      if (!active) return;

      blocks.forEach((b, idx) => {
        b.dist -= b.speed;
        if (b.dist <= 45) {
          // Hits central hexagon
          score += 10;
          document.getElementById('score').innerText = score;
          beep(520, 0.04);
          blocks.splice(idx, 1);
        }
      });

      if (Math.random() < 0.03) {
        spawnBlock();
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#0E1624';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Center Hexagon
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(hexAngle);

      for (let i = 0; i < 6; i++) {
        let a1 = i * Math.PI / 3;
        let a2 = (i + 1) * Math.PI / 3;
        ctx.strokeStyle = COLORS[i % 4];
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(35 * Math.cos(a1), 35 * Math.sin(a1));
        ctx.lineTo(35 * Math.cos(a2), 35 * Math.sin(a2));
        ctx.stroke();
      }
      ctx.restore();

      // Draw Incoming Blocks
      blocks.forEach(b => {
        let angle = b.side * Math.PI / 3 + hexAngle;
        let x1 = centerX + b.dist * Math.cos(angle - 0.4);
        let y1 = centerY + b.dist * Math.sin(angle - 0.4);
        let x2 = centerX + b.dist * Math.cos(angle + 0.4);
        let y2 = centerY + b.dist * Math.sin(angle + 0.4);

        ctx.strokeStyle = b.color;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') rotateHex(-1);
      else if (e.key === 'ArrowRight' || e.key === 'd') rotateHex(1);
    });

    document.getElementById('left').onpointerdown = () => rotateHex(-1);
    document.getElementById('right').onpointerdown = () => rotateHex(1);

    update();
  </script>
</body>
</html>
