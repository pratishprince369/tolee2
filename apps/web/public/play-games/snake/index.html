<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Classic - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .container {
      width: 100%;
      max-width: 380px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .header h1 { font-size: 24px; font-weight: 900; color: #00D2C4; }
    .score-badge {
      background: #0E1624;
      border: 1px solid #1F2D40;
      border-radius: 12px;
      padding: 4px 12px;
      text-align: center;
    }
    .score-badge small { display: block; font-size: 9px; color: #64748B; font-weight: 700; text-transform: uppercase; }
    .score-badge span { font-size: 15px; font-weight: 800; color: #00F0FF; }
    #canvas {
      background: #0E1624;
      border: 2px solid #1F2D40;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.12);
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
      margin-top: 14px;
      justify-content: center;
    }
    .d-btn {
      background: #0E1624;
      border: 1px solid #1F2D40;
      color: #00D2C4;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-btn:active {
      background: #00D2C4;
      color: #070B11;
      transform: scale(0.94);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 17, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SNAKE '97</h1>
      <div style="display:flex; gap:8px;">
        <div class="score-badge"><small>Score</small><span id="score">0</span></div>
        <div class="score-badge"><small>Best</small><span id="best">0</span></div>
      </div>
    </div>

    <canvas id="canvas" width="320" height="320"></canvas>

    <div class="dpad">
      <div></div>
      <button class="d-btn" id="btnUp">▲</button>
      <div></div>
      <button class="d-btn" id="btnLeft">◀</button>
      <div></div>
      <button class="d-btn" id="btnRight">▶</button>
      <div></div>
      <button class="d-btn" id="btnDown">▼</button>
      <div></div>
    </div>
  </div>

  <div class="overlay" id="gameOver">
    <h2 style="font-size: 28px; font-weight: 900; color: #00D2C4;">GAME OVER</h2>
    <p style="color:#94A3B8; font-size:13px;">Apples Eaten: <strong id="finalScore" style="color:white">0</strong></p>
    <button onclick="resetGame()" style="background:#00D2C4; color:#000; border:none; padding:10px 24px; border-radius:999px; font-weight:900; cursor:pointer;">PLAY AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const GRID = 16;
    const COUNT = canvas.width / GRID;

    let snake = [];
    let dx = 1;
    let dy = 0;
    let food = {x: 10, y: 10};
    let score = 0;
    let best = parseInt(localStorage.getItem('tolee_snake_best') || '0', 10);
    document.getElementById('best').innerText = best;
    let gameLoop = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, dur = 0.05) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function resetGame() {
      snake = [
        {x: 6, y: 10},
        {x: 5, y: 10},
        {x: 4, y: 10}
      ];
      dx = 1;
      dy = 0;
      score = 0;
      document.getElementById('score').innerText = '0';
      document.getElementById('gameOver').style.display = 'none';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(step, 100);
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * COUNT);
      food.y = Math.floor(Math.random() * COUNT);
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) {
          return spawnFood();
        }
      }
    }

    function step() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wall Wrap or Collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return handleGameOver();
      }

      for (let s of snake) {
        if (s.x === head.x && s.y === head.y) {
          return handleGameOver();
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        if (score > best) {
          best = score;
          localStorage.setItem('tolee_snake_best', best);
          document.getElementById('best').innerText = best;
        }
        playBeep(620, 0.06);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function handleGameOver() {
      clearInterval(gameLoop);
      playBeep(140, 0.3);
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOver').style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#0B1019';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food
      ctx.fillStyle = '#FF0055';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#FF0055';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake Body
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#00F0FF' : '#00D2C4';
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    // Direction Controls
    function setDir(newX, newY) {
      if (newX === -dx && newY === -dy) return; // prevent backflip
      dx = newX;
      dy = newY;
      playBeep(300, 0.02);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
      else if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
      else if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
      else if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
    });

    document.getElementById('btnUp').onclick = () => setDir(0, -1);
    document.getElementById('btnDown').onclick = () => setDir(0, 1);
    document.getElementById('btnLeft').onclick = () => setDir(-1, 0);
    document.getElementById('btnRight').onclick = () => setDir(1, 0);

    resetGame();
  </script>
</body>
</html>
