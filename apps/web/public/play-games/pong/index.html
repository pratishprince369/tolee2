<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pong Classic - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      width: 100%;
      max-width: 480px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title h1 { font-size: 22px; font-weight: 900; color: #00D2C4; }
    .score-board {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #00F0FF;
    }
    #canvas {
      background: #0A0F18;
      border: 2px solid #1F2D40;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
      cursor: crosshair;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="title">
        <h1>PONG '72</h1>
      </div>
      <div class="score-board">
        <span id="p1Score">0</span> : <span id="p2Score">0</span>
      </div>
    </div>

    <canvas id="canvas" width="400" height="480"></canvas>
    <div class="hint">Move mouse or drag on screen to slide paddle</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const PADDLE_W = 70;
    const PADDLE_H = 10;
    const BALL_R = 6;

    let p1X = (canvas.width - PADDLE_W) / 2;
    let p2X = (canvas.width - PADDLE_W) / 2;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 3.5 * (Math.random() > 0.5 ? 1 : -1);
    let ballSpeedY = 4;

    let p1Score = 0;
    let p2Score = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedY = -ballSpeedY;
      ballSpeedX = (Math.random() * 4 - 2);
    }

    function update() {
      // Move Ball
      ballX += ballSpeedX;
      ballY += ballSpeedY;

      // Bounce Walls
      if (ballX - BALL_R <= 0 || ballX + BALL_R >= canvas.width) {
        ballSpeedX = -ballSpeedX;
        beep(300, 0.03);
      }

      // AI Paddle Movement (Top)
      const aiTarget = ballX - PADDLE_W / 2;
      p2X += (aiTarget - p2X) * 0.085;
      p2X = Math.max(0, Math.min(canvas.width - PADDLE_W, p2X));

      // Bottom Paddle Collision (Player)
      if (
        ballY + BALL_R >= canvas.height - 25 &&
        ballY - BALL_R <= canvas.height - 15 &&
        ballX >= p1X &&
        ballX <= p1X + PADDLE_W
      ) {
        ballSpeedY = -Math.abs(ballSpeedY) * 1.03;
        const hitOffset = (ballX - (p1X + PADDLE_W / 2)) / (PADDLE_W / 2);
        ballSpeedX = hitOffset * 5;
        beep(520, 0.05);
      }

      // Top Paddle Collision (AI)
      if (
        ballY - BALL_R <= 25 &&
        ballY + BALL_R >= 15 &&
        ballX >= p2X &&
        ballX <= p2X + PADDLE_W
      ) {
        ballSpeedY = Math.abs(ballSpeedY) * 1.03;
        const hitOffset = (ballX - (p2X + PADDLE_W / 2)) / (PADDLE_W / 2);
        ballSpeedX = hitOffset * 5;
        beep(480, 0.05);
      }

      // Score Points
      if (ballY > canvas.height) {
        p2Score++;
        document.getElementById('p2Score').innerText = p2Score;
        beep(180, 0.2);
        resetBall();
      } else if (ballY < 0) {
        p1Score++;
        document.getElementById('p1Score').innerText = p1Score;
        beep(660, 0.15);
        resetBall();
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#0A0F18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center Net Line
      ctx.strokeStyle = '#1F2D40';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Top AI Paddle
      ctx.fillStyle = '#FF0055';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#FF0055';
      ctx.fillRect(p2X, 15, PADDLE_W, PADDLE_H);

      // Bottom Player Paddle
      ctx.fillStyle = '#00D2C4';
      ctx.shadowColor = '#00D2C4';
      ctx.fillRect(p1X, canvas.height - 25, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#00F0FF';
      ctx.shadowColor = '#00F0FF';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Controls
    function handleMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relativeX = clientX - rect.left;
      p1X = relativeX - PADDLE_W / 2;
      p1X = Math.max(0, Math.min(canvas.width - PADDLE_W, p1X));
    }

    canvas.addEventListener('mousemove', e => handleMove(e.clientX));
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      handleMove(e.touches[0].clientX);
    }, { passive: false });

    update();
  </script>
</body>
</html>
