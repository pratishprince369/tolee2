<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetris - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      padding: 10px;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title h1 { font-size: 24px; font-weight: 900; color: #00D2C4; }
    .stats {
      display: flex;
      gap: 8px;
    }
    .stat-pill {
      background: #0E1624;
      border: 1px solid #1F2D40;
      border-radius: 10px;
      padding: 4px 10px;
      text-align: center;
    }
    .stat-pill small { display: block; font-size: 9px; color: #64748B; font-weight: 700; text-transform: uppercase; }
    .stat-pill strong { font-size: 14px; color: #FFF; font-weight: 800; }
    #canvas {
      background: #0B1019;
      border: 2px solid #1F2D40;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 210, 196, 0.15);
      display: block;
    }
    .mobile-pad {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .pad-btn {
      background: #0E1624;
      border: 1px solid #202E42;
      color: #00D2C4;
      border-radius: 12px;
      height: 48px;
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .pad-btn:active {
      background: #00D2C4;
      color: #070B11;
      transform: scale(0.95);
    }
    .game-over-modal {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 17, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }
    .restart-btn {
      background: #00D2C4;
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="title">
        <h1>TETRIS</h1>
      </div>
      <div class="stats">
        <div class="stat-pill"><small>Score</small><strong id="score">0</strong></div>
        <div class="stat-pill"><small>Lines</small><strong id="lines">0</strong></div>
      </div>
    </div>

    <canvas id="canvas" width="240" height="400"></canvas>

    <!-- Mobile Touch Controls -->
    <div class="mobile-pad">
      <button class="pad-btn" id="btnLeft">◀</button>
      <button class="pad-btn" id="btnRotate">↻</button>
      <button class="pad-btn" id="btnRight">▶</button>
      <button class="pad-btn" id="btnDrop">▼</button>
    </div>
  </div>

  <div class="game-over-modal" id="gameOver">
    <h2 style="font-size: 28px; font-weight: 900; color: #00D2C4;">GAME OVER</h2>
    <p style="color:#94A3B8; font-size:14px;">Score: <strong id="finalScore" style="color:white">0</strong></p>
    <button class="restart-btn" onclick="startNewGame()">PLAY AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;

    const COLORS = [
      null,
      '#00D2C4', // I
      '#3B82F6', // J
      '#F59E0B', // L
      '#EAB308', // O
      '#10B981', // S
      '#8B5CF6', // T
      '#EF4444'  // Z
    ];

    const PIECES = [
      [],
      [[1,1,1,1]], // I
      [[2,0,0],[2,2,2]], // J
      [[0,0,3],[3,3,3]], // L
      [[4,4],[4,4]], // O
      [[0,5,5],[5,5,0]], // S
      [[0,6,0],[6,6,6]], // T
      [[7,7,0],[0,7,7]]  // Z
    ];

    let grid = createGrid();
    let piece = null;
    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let dropInterval = 600;
    let lastTime = 0;
    let isPaused = false;
    let gameOver = false;

    // Web Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 400, dur = 0.05) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function createGrid() {
      return Array.from({length: ROWS}, () => Array(COLS).fill(0));
    }

    function spawnPiece() {
      const type = Math.floor(Math.random() * 7) + 1;
      const shape = PIECES[type];
      piece = {
        x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
        y: 0,
        shape: shape,
        color: type
      };

      if (collide(grid, piece)) {
        gameOver = true;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOver').style.display = 'flex';
        playBeep(150, 0.3);
      }
    }

    function collide(g, p) {
      for (let r = 0; r < p.shape.length; r++) {
        for (let c = 0; c < p.shape[r].length; c++) {
          if (p.shape[r][c] !== 0) {
            let newX = p.x + c;
            let newY = p.y + r;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && g[newY][newX] !== 0) return true;
          }
        }
      }
      return false;
    }

    function merge(g, p) {
      p.shape.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val !== 0 && p.y + r >= 0) {
            g[p.y + r][p.x + c] = p.color;
          }
        });
      });
    }

    function rotate(matrix) {
      return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
    }

    function playerRotate() {
      const prevShape = piece.shape;
      piece.shape = rotate(piece.shape);
      if (collide(grid, piece)) {
        // wall kick
        piece.x += piece.x > COLS / 2 ? -1 : 1;
        if (collide(grid, piece)) {
          piece.shape = prevShape;
          return;
        }
      }
      playBeep(480, 0.04);
    }

    function playerMove(dir) {
      piece.x += dir;
      if (collide(grid, piece)) {
        piece.x -= dir;
      } else {
        playBeep(320, 0.03);
      }
    }

    function playerDrop() {
      piece.y++;
      if (collide(grid, piece)) {
        piece.y--;
        merge(grid, piece);
        playBeep(240, 0.05);
        clearLines();
        spawnPiece();
      }
      dropCounter = 0;
    }

    function clearLines() {
      let linesCleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(v => v !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          linesCleared++;
          r++;
        }
      }
      if (linesCleared > 0) {
        lines += linesCleared;
        score += linesCleared === 1 ? 100 : linesCleared === 2 ? 300 : linesCleared === 3 ? 500 : 800;
        document.getElementById('score').innerText = score;
        document.getElementById('lines').innerText = lines;
        playBeep(600 + linesCleared * 100, 0.15);
      }
    }

    function draw() {
      ctx.fillStyle = '#0B1019';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] !== 0) {
            ctx.fillStyle = COLORS[grid[r][c]];
            ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        }
      }

      // Draw Piece
      if (piece) {
        ctx.fillStyle = COLORS[piece.color];
        piece.shape.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val !== 0) {
              ctx.fillRect((piece.x + c) * BLOCK, (piece.y + r) * BLOCK, BLOCK - 1, BLOCK - 1);
            }
          });
        });
      }
    }

    function update(time = 0) {
      if (!gameOver) {
        const delta = time - lastTime;
        lastTime = time;
        dropCounter += delta;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
        draw();
        requestAnimationFrame(update);
      }
    }

    function startNewGame() {
      grid = createGrid();
      score = 0;
      lines = 0;
      gameOver = false;
      document.getElementById('score').innerText = '0';
      document.getElementById('lines').innerText = '0';
      document.getElementById('gameOver').style.display = 'none';
      spawnPiece();
      lastTime = performance.now();
      update();
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (gameOver) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') playerMove(-1);
      else if (e.key === 'ArrowRight' || e.key === 'd') playerMove(1);
      else if (e.key === 'ArrowDown' || e.key === 's') playerDrop();
      else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') playerRotate();
    });

    // Touch Pad Button bindings
    document.getElementById('btnLeft').addEventListener('pointerdown', e => { e.preventDefault(); playerMove(-1); });
    document.getElementById('btnRight').addEventListener('pointerdown', e => { e.preventDefault(); playerMove(1); });
    document.getElementById('btnRotate').addEventListener('pointerdown', e => { e.preventDefault(); playerRotate(); });
    document.getElementById('btnDrop').addEventListener('pointerdown', e => { e.preventDefault(); playerDrop(); });

    startNewGame();
  </script>
</body>
</html>
