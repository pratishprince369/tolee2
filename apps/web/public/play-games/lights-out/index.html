<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lights Out - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 360px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    h1 { font-size: 24px; font-weight: 900; color: #00D2C4; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 52px);
      grid-template-rows: repeat(5, 52px);
      gap: 8px;
      background: #0E1624;
      border: 2px solid #1F2D40;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.12);
    }
    .light {
      background: #141F30;
      border: 1px solid #202E42;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .light.on {
      background: #FACC15;
      border-color: #FEF08A;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.8);
    }
    .btn {
      background: #00D2C4;
      color: #070B11;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>LIGHTS OUT</h1>
    <p style="font-size: 12px; color: #94A3B8;">Turn off all lights to win!</p>
    <div class="grid" id="grid"></div>
    <button class="btn" onclick="initGame()">Restart Puzzle</button>
  </div>

  <script>
    let board = [];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function initGame() {
      board = Array.from({length: 5}, () => Array(5).fill(false));
      // Scramble with 8 random clicks
      for (let i = 0; i < 8; i++) {
        let r = Math.floor(Math.random() * 5);
        let c = Math.floor(Math.random() * 5);
        toggle(r, c, false);
      }
      render();
    }

    function toggle(r, c, playSound = true) {
      const flips = [[r,c],[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
      flips.forEach(([fr, fc]) => {
        if (fr >= 0 && fr < 5 && fc >= 0 && fc < 5) {
          board[fr][fc] = !board[fr][fc];
        }
      });
      if (playSound) beep(440, 0.03);
    }

    function render() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const div = document.createElement('div');
          div.className = 'light' + (board[r][c] ? ' on' : '');
          div.onclick = () => {
            toggle(r, c, true);
            render();
            checkWin();
          };
          gridEl.appendChild(div);
        }
      }
    }

    function checkWin() {
      if (board.every(row => row.every(cell => !cell))) {
        beep(880, 0.3);
        alert('🎉 Congratulations! You turned out all the lights!');
      }
    }

    initGame();
  </script>
</body>
</html>
