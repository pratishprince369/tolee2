<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="userAvatarBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="userIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Container -->
  <rect width="512" height="512" rx="140" fill="url(#userAvatarBg)" />
  
  <!-- Subtle inner ring -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="none" stroke="url(#userIconGrad)" stroke-width="2" stroke-opacity="0.25" />

  <!-- Single Professional User Silhouette Icon with Shadow -->
  <g filter="url(#shadow)" fill="url(#userIconGrad)">
    <!-- Shoulders / Chest -->
    <path d="M 120 380 
             C 120 310, 180 290, 256 290 
             C 332 290, 392 310, 392 380 
             C 392 390, 370 400, 256 400 
             C 142 400, 120 390, 120 380 
             Z" />
    <!-- Head -->
    <circle cx="256" cy="180" r="60" />
  </g>
</svg>
