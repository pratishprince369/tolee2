<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Teal Gradient -->
    <linearGradient id="coverTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b64" />
      <stop offset="35%" stop-color="#008080" />
      <stop offset="70%" stop-color="#0A7C75" />
      <stop offset="100%" stop-color="#03534e" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E8B83" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Teal Background -->
  <rect width="1200" height="400" fill="url(#coverTealGrad)" />

  <!-- Bottom Left Organic Wave Layers -->
  <path d="M 0 200 C 150 230, 300 310, 220 400 L 0 400 Z" fill="#045d57" opacity="0.65" />
  <path d="M 0 270 C 220 280, 350 350, 290 400 L 0 400 Z" fill="#0E8B83" opacity="0.5" />

  <!-- Giant Translucent 't' Monogram on the Right -->
  <g fill="#ffffff" fill-opacity="0.13" transform="translate(700, -10)">
    <!-- Lowercase t shape -->
    <path d="M 105 25 L 105 85 L 155 85 L 155 135 L 105 135 L 105 275 C 105 315, 125 340, 170 340 C 185 340, 202 336, 215 328 L 215 385 C 195 393, 162 398, 132 398 C 65 398, 38 360, 38 282 L 38 135 L 8 135 L 8 85 L 38 85 L 38 25 Z" />
  </g>

  <!-- Left Side: Tolee Branding -->
  <g transform="translate(60, 105)">
    <!-- Tolee Headline -->
    <text x="0" y="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1px">
      Tolee
    </text>
    <!-- Subtitle -->
    <text x="2" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.9" letter-spacing="0.2px">
      Your Community.
    </text>
    <text x="2" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.9" letter-spacing="0.2px">
      Your Voice. Your World.
    </text>
  </g>

  <!-- Right Side: Connect Create Belong in cursive script style -->
  <g transform="translate(980, 100)">
    <text x="0" y="24" font-family="'Brush Script MT', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="36" font-style="italic" fill="#5EEAD4" fill-opacity="0.95" letter-spacing="0.5px">
      Connect
    </text>
    <text x="4" y="65" font-family="'Brush Script MT', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="36" font-style="italic" fill="#5EEAD4" fill-opacity="0.95" letter-spacing="0.5px">
      Create
    </text>
    <text x="8" y="106" font-family="'Brush Script MT', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="38" font-style="italic" fill="#5EEAD4" fill-opacity="0.98" letter-spacing="0.5px">
      Belong
    </text>
    <!-- Underline flourish -->
    <path d="M 6 118 Q 50 128 115 115" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
