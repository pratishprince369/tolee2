<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Container -->
  <rect width="512" height="512" rx="140" fill="url(#avatarBg)" />
  
  <!-- Subtle inner ring -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-opacity="0.25" />

  <!-- Group Silhouette Icon with Shadow -->
  <g filter="url(#shadow)" fill="url(#iconGrad)">
    <!-- Left Person (Smaller, Back) -->
    <path d="M 180 340 
             C 180 300, 200 280, 230 280 
             C 240 280, 250 285, 260 290 
             C 250 305, 245 320, 245 340 
             Z" />
    <circle cx="215" cy="235" r="30" />

    <!-- Right Person (Smaller, Back) -->
    <path d="M 332 340 
             C 332 300, 312 280, 282 280 
             C 272 280, 262 285, 252 290 
             C 262 305, 267 320, 267 340 
             Z" />
    <circle cx="297" cy="235" r="30" />

    <!-- Center Person (Larger, Front) -->
    <path d="M 256 350 
             C 215 350, 195 320, 195 285 
             C 195 250, 220 245, 256 245 
             C 292 245, 317 250, 317 285 
             C 317 320, 297 350, 256 350 
             Z" />
    <circle cx="256" cy="180" r="42" />
  </g>
</svg>
