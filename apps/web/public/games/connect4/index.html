<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect Four - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 24px; font-weight: 900; color: #00D2C4; }
    .status {
      font-size: 14px;
      font-weight: 800;
      color: #CBD5E1;
    }
    .board-container {
      background: #0E1624;
      border: 2px solid #1F2D40;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(7, 40px);
      grid-template-rows: repeat(6, 40px);
      gap: 6px;
      background: #141F30;
      padding: 8px;
      border-radius: 12px;
    }
    .slot {
      width: 40px;
      height: 40px;
      background: #070B11;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s;
    }
    .slot.p1 { background: #FF0055; box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 0 10px #FF0055; }
    .slot.p2 { background: #F59E0B; box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 0 10px #F59E0B; }
    .slot.win { transform: scale(1.15); animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }
    .reset-btn {
      background: #00D2C4;
      color: #070B11;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>CONNECT FOUR</h1>
    <div class="status" id="status">Red's Turn</div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">New Match</button>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let grid = [];
    let turn = 1; // 1 = Red, 2 = Yellow
    let active = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.05) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function initGame() {
      grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
      turn = 1;
      active = true;
      document.getElementById('status').innerText = "Red's Turn";
      render();
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          if (grid[r][c] === 1) slot.classList.add('p1');
          else if (grid[r][c] === 2) slot.classList.add('p2');
          slot.addEventListener('click', () => dropPiece(c));
          boardEl.appendChild(slot);
        }
      }
    }

    function dropPiece(col) {
      if (!active) return;

      // Find lowest empty row in column
      let targetRow = -1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][col] === 0) {
          targetRow = r;
          break;
        }
      }

      if (targetRow === -1) return; // Column full

      grid[targetRow][col] = turn;
      beep(turn === 1 ? 440 : 660, 0.04);
      render();

      const winCombo = checkWin(turn);
      if (winCombo) {
        active = false;
        document.getElementById('status').innerText = `${turn === 1 ? 'Red' : 'Yellow'} Wins! 🎉`;
        beep(880, 0.3);
        highlightWin(winCombo);
        return;
      }

      if (grid.every(row => row.every(cell => cell !== 0))) {
        active = false;
        document.getElementById('status').innerText = "Match Drawn!";
        return;
      }

      turn = turn === 1 ? 2 : 1;
      document.getElementById('status').innerText = `${turn === 1 ? "Red" : "Yellow"}'s Turn`;

      // Simple AI move if Yellow turn
      if (turn === 2 && active) {
        setTimeout(aiMove, 250);
      }
    }

    function aiMove() {
      // Pick random valid column
      let validCols = [];
      for (let c = 0; c < COLS; c++) {
        if (grid[0][c] === 0) validCols.push(c);
      }
      if (validCols.length > 0) {
        const pick = validCols[Math.floor(Math.random() * validCols.length)];
        dropPiece(pick);
      }
    }

    function checkWin(p) {
      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === p && grid[r][c+1] === p && grid[r][c+2] === p && grid[r][c+3] === p) {
            return [[r,c],[r,c+1],[r,c+2],[r,c+3]];
          }
        }
      }
      // Vertical
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === p && grid[r+1][c] === p && grid[r+2][c] === p && grid[r+3][c] === p) {
            return [[r,c],[r+1,c],[r+2,c],[r+3,c]];
          }
        }
      }
      // Diagonal Down-Right
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === p && grid[r+1][c+1] === p && grid[r+2][c+2] === p && grid[r+3][c+3] === p) {
            return [[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]];
          }
        }
      }
      // Diagonal Up-Right
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === p && grid[r-1][c+1] === p && grid[r-2][c+2] === p && grid[r-3][c+3] === p) {
            return [[r,c],[r-1,c+1],[r-2,c+2],[r-3,c+3]];
          }
        }
      }
      return null;
    }

    function highlightWin(combo) {
      const slots = document.getElementsByClassName('slot');
      combo.forEach(([r, c]) => {
        slots[r * COLS + c].classList.add('win');
      });
    }

    initGame();
  </script>
</body>
</html>
