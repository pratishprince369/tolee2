<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Master - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 22px; font-weight: 900; color: #00D2C4; }
    .status { font-size: 13px; font-weight: 800; color: #CBD5E1; }
    .board-container {
      background: #0E1624;
      border: 2px solid #1F2D40;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 38px);
      grid-template-rows: repeat(8, 38px);
      border-radius: 8px;
      overflow: hidden;
    }
    .sq {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      position: relative;
    }
    .light { background: #D6D3D1; color: #1C1917; }
    .dark { background: #57534E; color: #F5F5F4; }
    .sq.selected { background: #00D2C4 !important; color: #000; }
    .sq.hint::after {
      content: '';
      width: 12px;
      height: 12px;
      background: rgba(0, 210, 196, 0.7);
      border-radius: 50%;
      position: absolute;
    }
    .btn {
      background: #00D2C4;
      color: #070B11;
      border: none;
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1>CHESS MASTER</h1>
      <div class="status" id="status">White to move</div>
    </div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <button class="btn" onclick="initBoard()">Restart Game</button>
  </div>

  <script>
    // Unicode Chess Glyphs
    const PIECES = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let board = [];
    let turn = 'w';
    let selectedSq = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.05) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function initBoard() {
      board = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
      ];
      turn = 'w';
      selectedSq = null;
      document.getElementById('status').innerText = 'White to move';
      render();
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          if (selectedSq && selectedSq.r === r && selectedSq.c === c) {
            sq.classList.add('selected');
          }

          const piece = board[r][c];
          if (piece) {
            sq.innerText = PIECES[piece] || piece;
          }

          sq.addEventListener('click', () => handleSqClick(r, c));
          boardEl.appendChild(sq);
        }
      }
    }

    function handleSqClick(r, c) {
      const piece = board[r][c];
      const isWhitePiece = piece && piece === piece.toUpperCase();
      const isBlackPiece = piece && piece === piece.toLowerCase();

      if (selectedSq) {
        // Move to destination
        if (selectedSq.r === r && selectedSq.c === c) {
          selectedSq = null;
          render();
          return;
        }

        // Apply move
        board[r][c] = board[selectedSq.r][selectedSq.c];
        board[selectedSq.r][selectedSq.c] = '';
        selectedSq = null;
        turn = turn === 'w' ? 'b' : 'w';
        document.getElementById('status').innerText = turn === 'w' ? 'White to move' : 'Black to move';
        beep(520, 0.05);
        render();

        // Very simple black move automation
        if (turn === 'b') {
          setTimeout(aiMoveBlack, 350);
        }
        return;
      }

      // Selection
      if (piece && ((turn === 'w' && isWhitePiece) || (turn === 'b' && isBlackPiece))) {
        selectedSq = { r, c };
        beep(360, 0.03);
        render();
      }
    }

    function aiMoveBlack() {
      // Find black pieces
      let blackPieces = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          let p = board[r][c];
          if (p && p === p.toLowerCase()) {
            blackPieces.push({ r, c });
          }
        }
      }

      if (blackPieces.length === 0) return;
      // Pick random piece and forward empty square or capture
      for (let bp of blackPieces) {
        let nr = bp.r + 1;
        if (nr < 8 && (!board[nr][bp.c] || board[nr][bp.c] === board[nr][bp.c].toUpperCase())) {
          board[nr][bp.c] = board[bp.r][bp.c];
          board[bp.r][bp.c] = '';
          turn = 'w';
          document.getElementById('status').innerText = 'White to move';
          beep(440, 0.05);
          render();
          return;
        }
      }
    }

    initBoard();
  </script>
</body>
</html>
