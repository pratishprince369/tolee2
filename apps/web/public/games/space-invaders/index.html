<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Invaders - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      width: 100%;
      max-width: 380px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 900; color: #10B981; }
    .score { font-size: 15px; font-weight: 900; color: #00F0FF; }
    #canvas {
      background: #000;
      border: 2px solid #10B981;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2);
    }
    .pad {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      background: #0E1624;
      border: 1px solid #1F2D40;
      color: #10B981;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:active { background: #10B981; color: #000; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1>SPACE INVADERS</h1>
      <div class="score">Score: <span id="score">0</span></div>
    </div>

    <canvas id="canvas" width="320" height="420"></canvas>

    <div class="pad">
      <button class="btn" id="btnLeft">◀</button>
      <button class="btn" id="btnFire" style="background:#EF4444; color:#FFF; border-color:#EF4444;">FIRE</button>
      <button class="btn" id="btnRight">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let playerX = canvas.width / 2 - 15;
    let bullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienSpeed = 0.8;
    let score = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function initAliens() {
      aliens = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 6; c++) {
          aliens.push({
            x: 30 + c * 45,
            y: 30 + r * 30,
            w: 24,
            h: 18,
            color: r === 0 ? '#EF4444' : r === 1 ? '#F59E0B' : '#10B981'
          });
        }
      }
    }

    function fire() {
      bullets.push({ x: playerX + 13, y: canvas.height - 35 });
      beep(880, 0.04);
    }

    function update() {
      // Bullets
      bullets.forEach((b, bIdx) => {
        b.y -= 6;
        // Hit Alien
        aliens.forEach((a, aIdx) => {
          if (b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
            aliens.splice(aIdx, 1);
            bullets.splice(bIdx, 1);
            score += 20;
            document.getElementById('score').innerText = score;
            beep(260, 0.06);
          }
        });
      });
      bullets = bullets.filter(b => b.y > 0);

      // Move Aliens
      let hitEdge = false;
      aliens.forEach(a => {
        a.x += alienDir * alienSpeed;
        if (a.x + a.w > canvas.width - 10 || a.x < 10) hitEdge = true;
      });

      if (hitEdge) {
        alienDir = -alienDir;
        aliens.forEach(a => a.y += 12);
      }

      if (aliens.length === 0) {
        initAliens();
        alienSpeed += 0.3;
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Player Cannon
      ctx.fillStyle = '#00D2C4';
      ctx.fillRect(playerX, canvas.height - 30, 26, 12);
      ctx.fillRect(playerX + 10, canvas.height - 38, 6, 8);

      // Bullets
      ctx.fillStyle = '#FACC15';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 8));

      // Aliens
      aliens.forEach(a => {
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x, a.y, a.w, a.h);
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && playerX > 10) playerX -= 15;
      else if (e.key === 'ArrowRight' && playerX < canvas.width - 40) playerX += 15;
      else if (e.key === ' ' || e.key === 'Enter') fire();
    });

    document.getElementById('btnLeft').onpointerdown = () => { if (playerX > 10) playerX -= 18; };
    document.getElementById('btnRight').onpointerdown = () => { if (playerX < canvas.width - 40) playerX += 18; };
    document.getElementById('btnFire').onpointerdown = fire;

    initAliens();
    update();
  </script>
</body>
</html>
