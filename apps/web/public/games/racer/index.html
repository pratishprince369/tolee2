<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turbo Racer 3D - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      width: 100%;
      max-width: 380px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 900; color: #00D2C4; }
    .speed { font-size: 15px; font-weight: 900; color: #F59E0B; }
    #canvas {
      background: #0A0F18;
      border: 2px solid #1F2D40;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      flex: 1;
      max-width: 130px;
      background: #0E1624;
      border: 1px solid #202E42;
      color: #00D2C4;
      padding: 14px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
    }
    .btn:active { background: #00D2C4; color: #000; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1>TURBO RACER</h1>
      <div class="speed">Speed: <span id="speed">120</span> KM/H</div>
    </div>

    <canvas id="canvas" width="320" height="420"></canvas>

    <div class="controls">
      <button class="btn" id="left">◀ STEER</button>
      <button class="btn" id="right">STEER ▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let playerX = 140;
    let roadOffset = 0;
    let score = 0;
    let cars = [
      { x: 100, y: -100, color: '#EF4444' },
      { x: 180, y: -300, color: '#3B82F6' }
    ];
    let active = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function update() {
      if (!active) return;
      roadOffset = (roadOffset + 8) % 40;

      // Update traffic
      cars.forEach(car => {
        car.y += 5;
        if (car.y > canvas.height + 50) {
          car.y = -80;
          car.x = 60 + Math.random() * 160;
          score += 50;
        }

        // Collision Check
        if (
          car.y + 40 > canvas.height - 70 &&
          car.y < canvas.height - 30 &&
          Math.abs(car.x - playerX) < 28
        ) {
          active = false;
          beep(120, 0.4);
          alert(`💥 Crash! Final Distance: ${score} meters`);
          location.reload();
        }
      });

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      // Grass
      ctx.fillStyle = '#064E3B';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Road
      ctx.fillStyle = '#1E293B';
      ctx.fillRect(40, 0, 240, canvas.height);

      // Road Borders
      ctx.fillStyle = '#E2E8F0';
      ctx.fillRect(40, 0, 8, canvas.height);
      ctx.fillRect(272, 0, 8, canvas.height);

      // Moving Dashed Center Line
      ctx.fillStyle = '#FACC15';
      for (let y = roadOffset - 40; y < canvas.height; y += 40) {
        ctx.fillRect(158, y, 4, 20);
      }

      // Player Car
      ctx.fillStyle = '#00D2C4';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00D2C4';
      ctx.fillRect(playerX, canvas.height - 70, 28, 45);
      // Windshield
      ctx.fillStyle = '#000';
      ctx.fillRect(playerX + 4, canvas.height - 58, 20, 10);
      ctx.shadowBlur = 0;

      // Traffic Cars
      cars.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, 28, 45);
        ctx.fillStyle = '#000';
        ctx.fillRect(c.x + 4, c.y + 12, 20, 10);
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && playerX > 55) playerX -= 25;
      else if (e.key === 'ArrowRight' && playerX < 235) playerX += 25;
    });

    document.getElementById('left').onpointerdown = () => { if (playerX > 55) playerX -= 25; };
    document.getElementById('right').onpointerdown = () => { if (playerX < 235) playerX += 25; };

    update();
  </script>
</body>
</html>
