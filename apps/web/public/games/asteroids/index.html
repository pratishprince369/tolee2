<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asteroids 360 - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .wrapper {
      width: 100%;
      max-width: 380px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 900; color: #00D2C4; }
    .score { font-size: 16px; font-weight: 900; color: #00F0FF; }
    #canvas {
      background: #000;
      border: 2px solid #1F2D40;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
    }
    .pad {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      background: #0E1624;
      border: 1px solid #202E42;
      color: #00D2C4;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:active { background: #00D2C4; color: #000; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1>ASTEROIDS 360</h1>
      <div class="score">Score: <span id="score">0</span></div>
    </div>

    <canvas id="canvas" width="340" height="380"></canvas>

    <div class="pad">
      <button class="btn" id="btnLeft">↺</button>
      <button class="btn" id="btnThrust">▲</button>
      <button class="btn" id="btnRight">↻</button>
      <button class="btn" id="btnFire" style="background:#FF0055; color:#FFF; border-color:#FF0055;">FIRE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 10,
      a: -Math.PI / 2,
      rot: 0,
      thrust: false,
      vx: 0,
      vy: 0
    };

    let lasers = [];
    let asteroids = [];
    let score = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function createAsteroid(x, y, r) {
      return {
        x: x || Math.random() * canvas.width,
        y: y || Math.random() * canvas.height,
        r: r || 25,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5
      };
    }

    function init() {
      asteroids = [];
      for (let i = 0; i < 5; i++) {
        asteroids.push(createAsteroid());
      }
    }

    function fire() {
      lasers.push({
        x: ship.x + 4/3 * ship.r * Math.cos(ship.a),
        y: ship.y + 4/3 * ship.r * Math.sin(ship.a),
        vx: 6 * Math.cos(ship.a),
        vy: 6 * Math.sin(ship.a),
        life: 50
      });
      beep(780, 0.04);
    }

    function update() {
      // Rotate Ship
      ship.a += ship.rot;

      // Thrust
      if (ship.thrust) {
        ship.vx += 0.1 * Math.cos(ship.a);
        ship.vy += 0.1 * Math.sin(ship.a);
      }
      ship.vx *= 0.985;
      ship.vy *= 0.985;
      ship.x += ship.vx;
      ship.y += ship.vy;

      // Wrap Ship
      if (ship.x < 0) ship.x = canvas.width;
      if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      if (ship.y > canvas.height) ship.y = 0;

      // Lasers
      lasers.forEach((l, idx) => {
        l.x += l.vx;
        l.y += l.vy;
        l.life--;
        if (l.x < 0) l.x = canvas.width;
        if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height;
        if (l.y > canvas.height) l.y = 0;

        // Hit Asteroids
        asteroids.forEach((a, aIdx) => {
          let dist = Math.hypot(l.x - a.x, l.y - a.y);
          if (dist < a.r) {
            lasers.splice(idx, 1);
            beep(220, 0.08);
            if (a.r > 15) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
            }
            asteroids.splice(aIdx, 1);
            score += 20;
            document.getElementById('score').innerText = score;
          }
        });
      });
      lasers = lasers.filter(l => l.life > 0);

      // Asteroids
      asteroids.forEach(a => {
        a.x += a.vx;
        a.y += a.vy;
        if (a.x < 0) a.x = canvas.width;
        if (a.x > canvas.width) a.x = 0;
        if (a.y < 0) a.y = canvas.height;
        if (a.y > canvas.height) a.y = 0;
      });

      if (asteroids.length < 3) {
        asteroids.push(createAsteroid());
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      ctx.strokeStyle = '#00F0FF';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(
        ship.x + 4/3 * ship.r * Math.cos(ship.a),
        ship.y + 4/3 * ship.r * Math.sin(ship.a)
      );
      ctx.lineTo(
        ship.x - ship.r * (2/3 * Math.cos(ship.a) + Math.sin(ship.a)),
        ship.y - ship.r * (2/3 * Math.sin(ship.a) - Math.cos(ship.a))
      );
      ctx.lineTo(
        ship.x - ship.r * (2/3 * Math.cos(ship.a) - Math.sin(ship.a)),
        ship.y - ship.r * (2/3 * Math.sin(ship.a) + Math.cos(ship.a))
      );
      ctx.closePath();
      ctx.stroke();

      // Lasers
      ctx.fillStyle = '#FF0055';
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Asteroids
      ctx.strokeStyle = '#A1A1AA';
      asteroids.forEach(a => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    // Input
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') ship.rot = -0.08;
      else if (e.key === 'ArrowRight' || e.key === 'd') ship.rot = 0.08;
      else if (e.key === 'ArrowUp' || e.key === 'w') ship.thrust = true;
      else if (e.key === ' ' || e.key === 'Enter') fire();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd') ship.rot = 0;
      else if (e.key === 'ArrowUp' || e.key === 'w') ship.thrust = false;
    });

    // Touch Pad
    const bL = document.getElementById('btnLeft');
    const bR = document.getElementById('btnRight');
    const bT = document.getElementById('btnThrust');
    const bF = document.getElementById('btnFire');

    bL.onpointerdown = () => ship.rot = -0.08;
    bL.onpointerup = () => ship.rot = 0;
    bR.onpointerdown = () => ship.rot = 0.08;
    bR.onpointerup = () => ship.rot = 0;
    bT.onpointerdown = () => ship.thrust = true;
    bT.onpointerup = () => ship.thrust = false;
    bF.onpointerdown = fire;

    init();
    update();
  </script>
</body>
</html>
