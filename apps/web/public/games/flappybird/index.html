<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .wrapper {
      width: 100%;
      max-width: 360px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 900; color: #00D2C4; }
    .score-pill {
      background: #0E1624;
      border: 1px solid #1F2D40;
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 15px;
      font-weight: 900;
      color: #00F0FF;
    }
    #canvas {
      background: #0A0F18;
      border: 2px solid #1F2D40;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.15);
      display: block;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748B;
      font-weight: 600;
    }
    .overlay {
      position: absolute;
      inset: 10px;
      background: rgba(7, 11, 17, 0.9);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1>FLAPPY BIRD</h1>
      <div class="score-pill">Score: <span id="score">0</span></div>
    </div>

    <canvas id="canvas" width="320" height="460"></canvas>
    <div class="hint">Tap screen or press Spacebar to flap</div>

    <div class="overlay" id="gameOver">
      <h2 style="font-size: 28px; font-weight: 900; color: #00D2C4;">GAME OVER</h2>
      <p style="color:#94A3B8; font-size:14px;">Score: <strong id="finalScore" style="color:white">0</strong></p>
      <button onclick="startGame()" style="background:#00D2C4; color:#000; border:none; padding:10px 24px; border-radius:999px; font-weight:900; cursor:pointer;">FLAP AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let birdY = 200;
    let birdV = 0;
    const gravity = 0.28;
    const jump = -5.8;

    let pipes = [];
    let pipeSpeed = 2;
    let score = 0;
    let gameOver = false;
    let animId = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.05) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function flap() {
      if (gameOver) return;
      birdV = jump;
      beep(550, 0.04);
    }

    function startGame() {
      birdY = 200;
      birdV = 0;
      pipes = [];
      score = 0;
      gameOver = false;
      document.getElementById('score').innerText = '0';
      document.getElementById('gameOver').style.display = 'none';

      // Spawn initial pipe
      addPipe();
      cancelAnimationFrame(animId);
      loop();
    }

    function addPipe() {
      const gap = 120;
      const topHeight = Math.floor(Math.random() * 200) + 40;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
      });
    }

    function loop() {
      birdV += gravity;
      birdY += birdV;

      // Spawn pipe every 100 frames
      if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 160) {
        addPipe();
      }

      // Move pipes
      for (let p of pipes) {
        p.x -= pipeSpeed;

        // Score
        if (!p.passed && p.x + 40 < 50) {
          p.passed = true;
          score++;
          document.getElementById('score').innerText = score;
          beep(680, 0.08);
        }

        // Collision
        if (50 + 12 > p.x && 50 - 12 < p.x + 44) {
          if (birdY - 10 < p.top || birdY + 10 > p.bottom) {
            return endGame();
          }
        }
      }

      // Filter off-screen
      pipes = pipes.filter(p => p.x > -60);

      // Floor & Ceiling Collision
      if (birdY > canvas.height - 15 || birdY < 10) {
        return endGame();
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function endGame() {
      gameOver = true;
      beep(150, 0.3);
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOver').style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#070B11';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pipes
      for (let p of pipes) {
        ctx.fillStyle = '#10B981';
        // Top pipe
        ctx.fillRect(p.x, 0, 44, p.top);
        // Bottom pipe
        ctx.fillRect(p.x, p.bottom, 44, canvas.height - p.bottom);
      }

      // Bird
      ctx.fillStyle = '#F59E0B';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#F59E0B';
      ctx.beginPath();
      ctx.arc(50, birdY, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Bird Eye
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(55, birdY - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      flap();
    });

    startGame();
  </script>
</body>
</html>
