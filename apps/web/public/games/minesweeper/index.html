<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper - Tolee Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B11;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 360px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .top-panel {
      width: 100%;
      background: #0E1624;
      border: 1px solid #1F2D40;
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .counter {
      background: #070B11;
      border: 1px solid #1F2D40;
      border-radius: 8px;
      font-family: monospace;
      font-size: 20px;
      font-weight: 900;
      color: #FF0055;
      padding: 4px 10px;
      min-width: 55px;
      text-align: center;
    }
    .face-btn {
      background: #141F30;
      border: 1px solid #202E42;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-template-rows: repeat(9, 32px);
      gap: 3px;
      background: #0E1624;
      border: 2px solid #1F2D40;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0, 210, 196, 0.12);
    }
    .cell {
      background: #192638;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .cell.revealed { background: #0B1019; }
    .cell.mine { background: #DC2626; color: white; }
    .cell.flag { color: #F59E0B; }
    .n1 { color: #38BDF8; }
    .n2 { color: #4ADE80; }
    .n3 { color: #F87171; }
    .n4 { color: #818CF8; }
    .n5 { color: #F43F5E; }
    .tools {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .toggle-flag {
      background: #0E1624;
      border: 1px solid #202E42;
      color: #CBD5E1;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .toggle-flag.active {
      background: #F59E0B;
      color: #070B11;
      border-color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-panel">
      <div class="counter" id="mineCount">10</div>
      <button class="face-btn" id="face" onclick="initGame()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="tools">
      <button class="toggle-flag" id="flagMode" onclick="toggleFlagMode()">🚩 Flag Mode: OFF</button>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let revealed = [];
    let flagged = [];
    let flagMode = false;
    let timerInterval = null;
    let time = 0;
    let active = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, dur = 0.04) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function toggleFlagMode() {
      flagMode = !flagMode;
      const btn = document.getElementById('flagMode');
      btn.innerText = `🚩 Flag Mode: ${flagMode ? 'ON' : 'OFF'}`;
      btn.className = `toggle-flag ${flagMode ? 'active' : ''}`;
    }

    function initGame() {
      clearInterval(timerInterval);
      time = 0;
      active = true;
      document.getElementById('timer').innerText = '000';
      document.getElementById('face').innerText = '🙂';
      document.getElementById('mineCount').innerText = MINES;

      board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
      revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
      flagged = Array.from({length: ROWS}, () => Array(COLS).fill(false));

      // Place Mines
      let placed = 0;
      while (placed < MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if (board[r][c] !== 'M') {
          board[r][c] = 'M';
          placed++;
        }
      }

      // Count neighbor numbers
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] === 'M') continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr;
              let nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === 'M') {
                count++;
              }
            }
          }
          board[r][c] = count;
        }
      }

      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const div = document.createElement('div');
          div.className = 'cell';
          if (revealed[r][c]) {
            div.classList.add('revealed');
            if (board[r][c] === 'M') {
              div.classList.add('mine');
              div.innerText = '💣';
            } else if (board[r][c] > 0) {
              div.classList.add(`n${board[r][c]}`);
              div.innerText = board[r][c];
            }
          } else if (flagged[r][c]) {
            div.classList.add('flag');
            div.innerText = '🚩';
          }

          div.addEventListener('click', (e) => handleClick(r, c));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          grid.appendChild(div);
        }
      }
    }

    function handleClick(r, c) {
      if (!active) return;
      if (time === 0) {
        timerInterval = setInterval(() => {
          time++;
          document.getElementById('timer').innerText = String(time).padStart(3, '0');
        }, 1000);
      }

      if (flagMode) {
        return toggleFlag(r, c);
      }

      if (flagged[r][c] || revealed[r][c]) return;

      if (board[r][c] === 'M') {
        // Boom!
        active = false;
        clearInterval(timerInterval);
        document.getElementById('face').innerText = '😵';
        beep(140, 0.4);
        // Reveal all mines
        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLS; j++) {
            if (board[i][j] === 'M') revealed[i][j] = true;
          }
        }
        render();
        return;
      }

      revealCell(r, c);
      beep(440, 0.03);
      checkWin();
      render();
    }

    function revealCell(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS || revealed[r][c] || flagged[r][c]) return;
      revealed[r][c] = true;
      if (board[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            revealCell(r + dr, c + dc);
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (!active || revealed[r][c]) return;
      flagged[r][c] = !flagged[r][c];
      beep(600, 0.03);
      let flagsLeft = MINES - flagged.flat().filter(Boolean).length;
      document.getElementById('mineCount').innerText = flagsLeft;
      render();
    }

    function checkWin() {
      let win = true;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] !== 'M' && !revealed[r][c]) win = false;
        }
      }
      if (win) {
        active = false;
        clearInterval(timerInterval);
        document.getElementById('face').innerText = '😎';
        beep(880, 0.3);
      }
    }

    initGame();
  </script>
</body>
</html>
