version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tolee_db
      POSTGRES_USER: tolee
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://tolee:secret@db:5432/tolee_db
      REDIS_URL: redis://redis:6379

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
